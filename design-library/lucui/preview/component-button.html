<!DOCTYPE html><html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lucUI — Button Preview</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  body { background: var(--background); color: var(--foreground); font-family: var(--font-body); padding: 2rem; }
  .demo-group { margin-bottom: 2rem; }
  .demo-group h2 { font-family: var(--font-display); font-size: var(--font-size-xl); margin-bottom: 1rem; }
  .demo-row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-bottom: 0.75rem; }
</style>
</head>
<body>
  <div class="demo-group">
    <h2>Button Variants</h2>
    <div class="demo-row">
      <button class="lucui-btn lucui-btn-primary lucui-btn-md">Primary</button>
      <button class="lucui-btn lucui-btn-secondary lucui-btn-md">Secondary</button>
      <button class="lucui-btn lucui-btn-outline lucui-btn-md">Outline</button>
      <button class="lucui-btn lucui-btn-ghost lucui-btn-md">Ghost</button>
      <button class="lucui-btn lucui-btn-azure lucui-btn-md">Azure</button>
      <button class="lucui-btn lucui-btn-gold lucui-btn-md">Gold</button>
      <button class="lucui-btn lucui-btn-transparency lucui-btn-md">Transparency</button>
    </div>
  </div>

  <div class="demo-group">
    <h2>Sizes</h2>
    <div class="demo-row">
      <button class="lucui-btn lucui-btn-primary lucui-btn-sm">Small</button>
      <button class="lucui-btn lucui-btn-primary lucui-btn-md">Medium</button>
      <button class="lucui-btn lucui-btn-primary lucui-btn-lg">Large</button>
    </div>
  </div>

  <div class="demo-group">
    <h2>States</h2>
    <div class="demo-row">
      <button class="lucui-btn lucui-btn-primary lucui-btn-md">Default</button>
      <button class="lucui-btn lucui-btn-primary lucui-btn-md" disabled>Disabled</button>
    </div>
  </div>

  <div class="demo-group" data-theme="light">
    <h2>Light Theme</h2>
    <div class="demo-row">
      <button class="lucui-btn lucui-btn-primary lucui-btn-md">Primary</button>
      <button class="lucui-btn lucui-btn-secondary lucui-btn-md">Secondary</button>
      <button class="lucui-btn lucui-btn-outline lucui-btn-md">Outline</button>
      <button class="lucui-btn lucui-btn-ghost lucui-btn-md">Ghost</button>
      <button class="lucui-btn lucui-btn-transparency lucui-btn-md">Transparency</button>
    </div>
  </div>
</body>
</html>
