<!DOCTYPE html><html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lucUI — Input Preview</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  body { background: var(--background); color: var(--foreground); font-family: var(--font-body); padding: 2rem; }
  .demo-group { margin-bottom: 2rem; }
  .demo-group h2 { font-family: var(--font-display); font-size: var(--font-size-xl); margin-bottom: 1rem; }
  .demo-form { display: flex; flex-direction: column; gap: 1.25rem; max-width: 400px; }
</style>
</head>
<body>
  <div class="demo-group">
    <h2>Input Variants</h2>
    <div class="demo-form">
      <div>
        <label class="lucui-label" for="text-demo">Text Input</label>
        <input class="lucui-input" id="text-demo" type="text" placeholder="Enter your email">
      </div>
      <div>
        <label class="lucui-label" for="select-demo">Select</label>
        <select class="lucui-select" id="select-demo">
          <option>Choose an option</option>
          <option>Option one</option>
          <option>Option two</option>
          <option>Option three</option>
        </select>
      </div>
      <div>
        <label class="lucui-label" for="textarea-demo">Textarea</label>
        <textarea class="lucui-textarea" id="textarea-demo" placeholder="Write your message here..."></textarea>
      </div>
      <div>
        <label class="lucui-label" for="error-demo">Error State</label>
        <input class="lucui-input lucui-input-error" id="error-demo" type="text" placeholder="This field is required" value="invalid@">
      </div>
    </div>
  </div>

  <div class="demo-group" data-theme="light">
    <h2>Light Theme</h2>
    <div class="demo-form">
      <div>
        <label class="lucui-label" for="text-light">Text Input</label>
        <input class="lucui-input" id="text-light" type="text" placeholder="Enter your name">
      </div>
      <div>
        <label class="lucui-label" for="select-light">Select</label>
        <select class="lucui-select" id="select-light">
          <option>Choose an option</option>
          <option>Option one</option>
          <option>Option two</option>
        </select>
      </div>
    </div>
  </div>
</body>
</html>
